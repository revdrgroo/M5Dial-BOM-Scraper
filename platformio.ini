; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32_boards

[env]
build_flags = 
	-D LV_USE_DEMO_WIDGETS=0
	-D SCREEN_WIDTH=320
	-D SCREEN_HEIGHT=240
	-D SCREEN_ROTATE=3
lib_deps = 
	lvgl@9.1
lib_archive = false

[env:emulator_64bits]
platform = native@^1.1.3
extra_scripts = 
	pre:support/sdl2_paths.py
	post:support/sdl2_build_extra.py
build_flags = 
	${env.build_flags}
	-D LV_LOG_PRINTF=1
	!python -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('hal/sdl2')]))"
	-lSDL2
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D LV_DRV_NO_CONF
	-D LV_USE_SDL
	-D SDL_HOR_RES=320
	-D SDL_VER_RES=240
	-D SDL_ZOOM=1
	-D LV_SDL_INCLUDE_PATH="\"SDL2/SDL.h\""
	
	-D LV_MEM_CUSTOM=1
	-D LV_MEM_SIZE="(128U * 1024U)"
lib_deps = 
	${env.lib_deps}
	exocet22/TinyFTPClient@^1.2.1
	marian-craciunescu/ESP32Ping@^1.7
	adafruit/TinyXML@^1.0.3
build_src_filter = 
	+<*>
	+<../hal/sdl2>
	+<../.pio/libdeps/emulator_64bits/lvgl/demos>

[env:emulator_32bits]
extends = env:emulator_64bits
build_flags = 
	${env:emulator_64bits.build_flags}
	-m32
build_src_filter = 
	+<*>
	+<../hal/sdl2>
	+<../.pio/libdeps/emulator_32bits/lvgl/demos>
lib_deps = 
	exocet22/TinyFTPClient@^1.2.1
	dvarrel/ESPping@^1.0.5
	marian-craciunescu/ESP32Ping@^1.7
	adafruit/TinyXML@^1.0.3

[env:esp32_boards]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
	${env.build_flags}
	-D LV_LOG_LEVEL=LV_LOG_LEVEL_NONE
	-D ENABLE_DEBUG_PING
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
	!python -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('hal/esp32')]))"
lib_deps = 
	${env.lib_deps}
	lovyan03/LovyanGFX@^1.2.0
	smartpanle/PanelLan@^0.0.1
	exocet22/TinyFTPClient@^1.2.1
	marian-craciunescu/ESP32Ping@^1.7
	adafruit/TinyXML@^1.0.3
build_src_filter = 
	+<*>
	+<../hal/esp32>
	+<../.pio/libdeps/esp32_boards/lvgl/demos>

[env:m5stack-cores3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200

lib_deps = 
	${env.lib_deps}
	exocet22/TinyFTPClient@^1.2.1
	marian-craciunescu/ESP32Ping@^1.7
	adafruit/TinyXML@^1.0.3
    m5stack/M5Dial
    m5stack/M5Unified

board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.filesystem = spiffs